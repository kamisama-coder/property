<div class="explore-wrapper bg-light">
  <!-- Page Header -->
  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary">Explore Properties</h1>
    <p class="lead text-muted">Find your dream home today</p>
  </div>

  <!-- Property Cards Grid -->
  <div class="container">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <div *ngFor="let item of setup" class="col">
        <div class="card shadow-sm h-100 rounded-4 border-0">
          <div class="card-body">
            <h5 class="card-title text-dark">{{ item.bhk }} BHK</h5>
            <p class="mb-2 text-muted">{{ item.size }} sqft</p>
            <h6 class="card-subtitle mb-2 text-muted">{{ item.address }}</h6>

            <p class="card-text fs-5 text-success fw-semibold">
              ₹{{ item.price }} {{ item.price_suffix }}
            </p>

            <p class="mb-2 text-dark">
              <strong>Per Sqft Rate:</strong> {{ item.per_square_rate }}
            </p>

            <ul class="list-unstyled small text-muted">
              <li><i class="bi bi-telephone"></i> {{ item.phone }}</li>
              <li><i class="bi bi-geo-alt"></i>proxy address: {{ item.proxy_address }}</li>
              <li><i class="bi bi-check-circle-fill text-success"></i> Status: {{ item.status }}</li>
              <button class="btn btn-outline-secondary w-100" (click)="pics(item.id)">
              🖼️ Pictures
              </button>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
