<!-- Search Input + Button -->
<div class="d-flex flex-column flex-md-row align-items-stretch gap-3 mb-4">
  <input
    type="text"
    [(ngModel)]="query"
    placeholder="Enter something..."
    class="form-control flex-grow-1 shadow-sm rounded-pill px-4 py-2"
  />
  <button class="btn btn-success px-4 rounded-pill shadow-sm" (click)="handleIndependentInput()">
    Submit
  </button>
</div>

<!-- Cards in Responsive Grid -->
<div class="row g-4">
  <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let i of setup">
    <div class="card h-100 shadow custom-card">
      <div class="card-body d-flex flex-column justify-content-between">
        <div>
          <h5 class="card-title fw-bold">{{ i.id }}</h5>
          <p class="card-text text-muted">{{ i.address }}</p>
          <p class="card-text">Price: ₹{{ i.price }} {{ i.price_suffix }}</p>
          <p class="card-text">{{ i.phone }}</p>
        </div>
        <div class="mt-3 d-flex flex-column gap-2">
          <button class="btn btn-outline-primary w-100" (click)="gotomap(i.long, i.latt)">
            📍 Check Map
          </button>
          <button class="btn btn-outline-secondary w-100" (click)="pics(i.id)">
            🖼️ Pictures
          </button>
          <button class="btn btn-outline-secondary w-100" (click)="edit(i.id)">
            Edit
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
